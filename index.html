<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#0b3d2e"/>
<title>Kenya Drug Index</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet"/>
<style>
:root{--green:#0b3d2e;--red:#b11a2b;--paper:#f4f1ea;--card:#fffdf8;--line:#d7d0c4;--muted:#5c675f;--brand:#c97816}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Source Sans 3,system-ui,sans-serif;background:var(--paper);color:#111}
header{background:linear-gradient(160deg,#0b3d2e,#07261d);color:#f7f4ee;padding:16px 18px;position:sticky;top:0;z-index:20}
.crest{width:42px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;font-weight:700;color:var(--green);border:3px solid #c5a24a}
.brand-row{display:flex;gap:12px;align-items:center}
h1{font-family:Source Serif 4,Georgia,serif;font-size:1.15rem;margin:0}
.sub{font-size:.78rem;opacity:.85}
.stripes{height:6px;display:flex}.stripes span{flex:1}.k{background:#111}.r{background:var(--red)}.g{background:#1f7a3a}
.search-wrap{margin-top:12px;display:flex;gap:8px}
input,select{border:0;border-radius:10px;padding:10px 12px;font:inherit;width:100%;background:#f3faf6}
select{width:auto;min-width:140px}
.stats{margin-top:8px;font-size:.75rem;opacity:.9}
main{display:grid;max-width:1200px;margin:0 auto}
@media(min-width:900px){main{grid-template-columns:360px 1fr;min-height:calc(100vh - 150px)}}
.list-pane{border-right:1px solid var(--line);background:#f7f3eb;max-height:calc(100vh - 150px);overflow:auto}
.drug-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px;cursor:pointer;font:inherit}
.drug-item:hover,.drug-item.active{background:#fff}
.g{font-weight:700;color:var(--green)}.b{font-size:.8rem;color:var(--muted)}.c{font-size:.7rem;color:var(--brand)}
.detail{padding:16px;overflow:auto}
.empty{color:var(--muted);padding:40px 16px;text-align:center}
h2{font-family:Source Serif 4,Georgia,serif;color:var(--green);margin:0 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.pill{background:#e8f3ec;color:var(--green);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.pill.brand{background:#f8ead3;color:#7a4a0a}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.warn{background:#fff4e5;border:1px solid #efd2a0;color:#6a4b10;padding:10px 12px;border-radius:10px;font-size:.82rem;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:6px;border-bottom:1px solid #eee8dc}
footer{max-width:1200px;margin:0 auto;padding:18px;font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<div class="stripes"><span class="k"></span><span class="r"></span><span class="g"></span></div>
<header>
<div class="brand-row"><div class="crest">KE</div><div><h1>Kenya Drug Index</h1><div class="sub">For health workers · KEML 2023 · KNMF 2023 · PPB trade names</div></div></div>
<div class="search-wrap"><input id="q" type="search" placeholder="Search generic or brand (Coartem, TLD, Panadol)" autofocus/><select id="cat"><option value="">All categories</option></select></div>
<div class="stats"><span id="count">Loading…</span></div>
</header>
<main>
<div class="list-pane" id="list"></div>
<div class="detail" id="detail"><div class="empty">Search or tap a medicine.</div></div>
</main>
<footer>Public preview. Full 828-medicine offline app is in the project folder kenya-drug-index-app. Confirm packs on products.pharmacyboardkenya.org. Not a substitute for KNMF.</footer>
<script src="drugs.js"></script>
<script>
const drugs = window.DRUGS || [];
const listEl=document.getElementById("list");
const detailEl=document.getElementById("detail");
const qEl=document.getElementById("q");
const catEl=document.getElementById("cat");
const countEl=document.getElementById("count");
[...new Set(drugs.map(d=>d.category).filter(Boolean))].sort().forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;catEl.appendChild(o)});
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&","<":"<",">":">","\"":"""}[c]))}
function hay(d){return (d.generic+" "+(d.brands||[]).join(" ")).toLowerCase()}
function filter(){const q=qEl.value.trim().toLowerCase();return drugs.filter(d=>(!catEl.value||d.category===catEl.value)&&(!q||hay(d).includes(q)))}
function render(){const rows=filter();countEl.textContent=rows.length+" medicines";listEl.innerHTML="";rows.forEach(d=>{const b=document.createElement("button");b.className="drug-item";b.innerHTML=`<div class="g">${esc(d.generic)}</div><div class="b">${(d.brands||[]).slice(0,6).join(" · ")||"Generic / INN"}</div><div class="c">${esc(d.category||"")}</div>`;b.onclick=()=>show(d);listEl.appendChild(b)})}
function show(d){
 const brands=(d.brands||[]).map(b=>`<span class="pill brand">${esc(b)}</span>`).join("");
 const forms=(d.formulations||[]).map(f=>`<tr><td>${esc(f.form)}</td><td>${esc(f.strength)}</td><td>${esc(f.lou)}</td></tr>`).join("");
 const when=(d.when_to_use||[]).map(h=>`<section class="card" style="border-color:#c5a24a;background:#fffaf0"><h3>When to use in Kenya — ${esc(h.title)}</h3><p>${esc(h.text)}</p><p style="font-size:.78rem;color:var(--muted)">${esc(h.source||"")}</p></section>`).join("");
 detailEl.innerHTML=`<h2>${esc(d.generic)}</h2><div class="pills">${brands}</div><div class="warn">Confirm pack, strength and PPB registration before use.</div>${when}<section class="card"><h3>Formulations</h3>${forms?`<table><thead><tr><th>Form</th><th>Strength</th><th>LOU</th></tr></thead><tbody>${forms}</tbody></table>`:"<p>See KNMF / pack.</p>"}</section><section class="card"><h3>Indications</h3><p>${esc(d.indications||"")}</p></section>`;
}
qEl.oninput=render;catEl.onchange=render;render();
const p=new URLSearchParams(location.search);if(p.get("q")){qEl.value=p.get("q");render();const hit=filter()[0];if(hit)show(hit)}
</script>
</body></html>
